services:
  app:
    image: ${IMAGE_URI}
    container_name: quoptuna
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/quoptuna/runtime.env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    container_name: quoptuna-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - /opt/quoptuna/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
